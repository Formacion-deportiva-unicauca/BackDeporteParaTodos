#definicion de puerto de conexion
server.port= 8082
spring.application.name= deporteParaTodos

#Conexion a base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/deporteParaTodos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#JPA settings
spring.jpa.hibernate.ddl-auto= none

#mostrar sql formato
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Documentacion de la API (Swagger): visible por defecto; en el servidor se apaga con SPRINGDOC_ENABLED=false
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

#manejo de datos grandes - para envio y recepcion de multimedia, en este caso imagenes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#habilitar el manejo de archivos multipart
spring.servlet.multipart.enabled=true

#configuracion de log
logging.level.root=INFO
logging.level.co.edu.unicauca.deporteParaTodos=INFO

# --- Spring Security / OAuth2 ---
# JWKS de Google para validar tokens ID entrantes (rotacion de claves automatica)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
# client_id de la app en Google (OAuth) contra el que se valida el claim "aud" del ID Token.
# Es un dato PUBLICO (el mismo que usa el frontend para iniciar sesion con Google), no un secreto,
# pero igual se exige por variable de entorno y sin valor por defecto: si falta, el arranque falla.
# Definir como variable de entorno: export GOOGLE_CLIENT_ID=<client_id de Google Cloud Console>
app.google.client-id=${GOOGLE_CLIENT_ID}
# Secreto HMAC-SHA256 para firmar los JWT propios del sistema.
# Definir como variable de entorno: export JWT_SECRET=$(openssl rand -base64 32)
# Nunca commitear el valor real -- mismo patron que SONAR_TOKEN en CI.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Limite de inscripciones activas simultaneas por alumno
inscripciones.limite-cursos-alumno=3