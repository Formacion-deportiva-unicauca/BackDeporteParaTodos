services:
  mysql:
    image: mysql:8.0
    container_name: mysql-deporte
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: deporteParaTodos
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  migraciones:
    image: flyway/flyway:11.13.3@sha256:f0e7c2fb49f55487d8e35bf54e38c1bdf01eeb27444bc10c75c69be3d9e71621
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./db/flyway:/flyway/sql:ro
      - ./db/local:/flyway/local:ro
    command:
      - -url=jdbc:mysql://mysql:3306/deporteParaTodos?allowPublicKeyRetrieval=true&useSSL=false
      - -user=root
      - -password=${DB_PASSWORD}
      - -locations=filesystem:/flyway/sql,filesystem:/flyway/local
      - migrate

volumes:
  mysql_data:
