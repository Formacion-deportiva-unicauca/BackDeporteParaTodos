name: Publicar imagen en GHCR

# Se ejecuta solo al crear una etiqueta de version (v1.0.0, v1.1.0, ...) o a mano.
# No publica en cada push: asi cada imagen que llega al servidor fue una decision.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publicar-imagen-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGEN: ghcr.io/formacion-deportiva-unicauca/deporte-backend

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Calcular etiqueta (commit corto)
        id: v
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ env.IMAGEN }}:${{ steps.v.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen (evidencia)
        run: |
          {
            echo "### Imagen publicada"
            echo "- Imagen: \`${{ env.IMAGEN }}:${{ steps.v.outputs.sha }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Commit: ${{ github.sha }}"
            echo "- Ejecutado por: ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
