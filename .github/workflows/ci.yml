name: CI

on:
  push:
    branches:
      - main
      - test
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: deporteParaTodos
          MYSQL_USER: ci
          MYSQL_PASSWORD: cipass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptestroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Apply database migrations (Flyway)
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/db/flyway:/flyway/sql:ro" \
            -v "$GITHUB_WORKSPACE/db/ci:/flyway/ci:ro" \
            flyway/flyway:11.13.3@sha256:f0e7c2fb49f55487d8e35bf54e38c1bdf01eeb27444bc10c75c69be3d9e71621 \
            -url="jdbc:mysql://127.0.0.1:3306/deporteParaTodos?allowPublicKeyRetrieval=true&useSSL=false" \
            -locations=filesystem:/flyway/sql,filesystem:/flyway/ci \
            -user=root -password=testroot migrate info

      - name: Build and run tests
        run: mvn --batch-mode --update-snapshots verify
        env:
          DB_USER: ci
          DB_PASSWORD: cipass

      - name: SonarCloud analysis
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mvn --batch-mode sonar:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Upload Surefire test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 30
