name: CI

on:
  push:
    branches:
      - main
      - test
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: deporteParaTodos
          MYSQL_USER: ci
          MYSQL_PASSWORD: cipass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptestroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Load database schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y mysql-client
          mysql -h127.0.0.1 -P3306 -uroot -ptestroot deporteParaTodos < src/main/resources/DDL-MYSQL.sql

      - name: Build and run tests
        run: mvn --batch-mode --update-snapshots verify
        env:
          DB_USER: ci
          DB_PASSWORD: cipass

      - name: SonarCloud analysis
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mvn --batch-mode sonar:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Upload Surefire test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 30
